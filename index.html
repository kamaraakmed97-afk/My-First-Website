<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<metaname="viewport"content="width=device-width initial-scale=1.0">
<title>Student Grade Calculator</title>
<linkrel="stylesheet"href="style.css">
</head>
<body>
<div class="container">
 <h1>Student Grade Calculator</h1>

 <label for="studentName">Student Name:</label> 
	<input type="text" id="studentName" placeholder="Enter your name">
  <label for="webTechnology">Web Technology:</label>
  <input type="number" id="webTechnology" placeholder="Enter mark">
  <label for="statistics">Statistics:</label>
 <input type="number" id="statistics" placeholder="Enter mark">
 <label for="computerArchitecture">Computer Architecture and Logistics:</label>
 <input type="number" id="computerArchitecture" placeholder="Enter mark">
  <label for="entrepreneurship">Entrepreneurship:</label>
 <input type="number" id="entrepreneurship" placeholder="Enter mark"> 
 <label for="oop">Object-Oriented Programming:</label>
<input type="number" id="oop" placeholder="Enter mark">
<label for="dataStructure">Data Structure and Algorithm:</label>
<input type="number" id="dataStructure" placeholder="Enter mark">
 <label for="msOffice">MS Office Suite:</label>
 <input type="number" id="msOffice" placeholder="Enter mark">
 <label for="databaseManagement">Database Management System:</label>
 <input type="number" id="databaseManagement" placeholder="Enter mark"> 
<button onclick="calculateGrade()">Calculate Grade</button>
<div id="result"></div>
</div>
<script src="script.js"></script>
 </body>   
</html>
